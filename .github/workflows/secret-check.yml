name: Secret check

# Safety net: runs the same check as the local pre-commit hook on GitHub,
# in case someone has not turned the hook on. It looks at the current files
# and at every pushed commit, so a key that was added and deleted again is
# still found.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed to look at each commit
      - name: Look for secrets in the files and in the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: sh .githooks/ci-secret-check.sh
